<!DOCTYPE html>
<html>
<head>
<title>QR Generator</title>

<style>
body{
    background:violet;
    font-family:Arial,sans-serif;
}

.container{
    width:800px;
    margin:50px auto;
    background:white;
    padding:40px;
    border-radius:12px;
}

textarea{
    width:100%;
    padding:15px;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    background:blueviolet;
    color:white;
    font-size:18px;
}

.qr{
    text-align:center;
}
</style>

</head>
<body>
<div class="container">
<h2>QR Code Generator</h2>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button type="submit"> Generate QR </button>
</form>

</div>

{% if img %}

<div class="qr">

<h3>Generated QR</h3>

<img src="/media/qr/{{ img }}" width="300">

</div>

{% endif %}

</body>
</html>
