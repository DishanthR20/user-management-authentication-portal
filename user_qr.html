<!DOCTYPE html>
<html>
<head>
<title>URL QR Generator</title>

<style>

body{
    background:violet;
    font-family:Arial,sans-serif;
}

.container{
    width:800px;
    margin:50px auto;
    background:white;
    padding:40px;
    border-radius:12px;
}

input{
    width:100%;
    padding:15px;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    background:blueviolet;
    color:white;
    font-size:18px;
}

.qr{
    text-align:center;
    margin-top:30px;
}

</style>
</head>

<body>

<div class="container">

<h2>User details</h2>

{% if img %}

<div class="qr">

<h3>Generated QR</h3>

<img src="/media/qr/{{ img }}" width="300">

</div>

{% endif %}

</div>

</body>
</html>
