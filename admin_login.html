<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:violet;
        }

        .container{
            width:500px;
            background:white;
            padding:40px;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
            margin-bottom:30px;
        }

        .field{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:6px;
        }

        .submit-btn{
            width:100%;
            border:none;
            padding:15px;
            border-radius:6px;
            background:blueviolet;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        .alert{
            background:#ffe5e5;
            color:#d63031;
            padding:12px;
            border-left:5px solid #d63031;
            border-radius:6px;
            margin-bottom:20px;
            font-weight:600;
        }

        .link{
            text-align:center;
            margin-top:20px;
        }

    </style>

</head>
<body>

<div class="container">

    <h2>Admin Login</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="field">
            <label>Username</label>
            {{ form.username }}
        </div>

        <div class="field">
            <label>Password</label>
            {{ form.password }}
        </div>

        <button type="submit" class="submit-btn">Login</button>

    </form>

    <div class="link">
        <a href="{% url 'create_admin' %}">
            Create Admin Account
        </a>
    </div>

</div>

</body>
</html>
