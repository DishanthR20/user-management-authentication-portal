<!DOCTYPE html>
<html>

<head>
    <title>User Profile</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .profile-card{
            width: 650px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h2{
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .profile-pic{
            text-align: center;
            margin-bottom: 25px;
        }

        .field{
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }

        .label{
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }

        .value{
            color: #222;
        }

    </style>

</head>

<body>

<div class="profile-card">

    <h2>User Profile</h2>

    {% if user.pfpic %}
    <div class="profile-pic">
        <img src="{{ user.pfpic.url }}" alt="Profile Picture" width="150" height="150" style="border-radius:50%;">
    </div>
    {% endif %}

    <div class="field">
        <div class="label">Name</div>
        <div class="value">{{ user.name }}</div>
    </div>

    <div class="field">
        <div class="label">Email</div>
        <div class="value">{{ user.email }}</div>
    </div>

    <div class="field">
        <div class="label">Age</div>
        <div class="value">{{ user.age }}</div>
    </div>

    <div class="field">
        <div class="label">Gender</div>
        <div class="value">{{ user.gender }}</div>
    </div>

    <div class="field">
        <div class="label">Phone Number</div>
        <div class="value">{{ user.phone_num }}</div>
    </div>

    <div class="field">
        <div class="label">Date of Birth</div>
        <div class="value">{{ user.dob }}</div>
    </div>

    <div class="field">
        <div class="label">Course</div>
        <div class="value">{{ user.course }}</div>
    </div>

    <div class="field">
        <div class="label">Interests</div>

        {% for interest in user.interests %}
            {{ interest }}
        {% endfor %}
    </div>

</div>

</body>

</html>
